name: Report a correction
description: Flag inaccurate, outdated, unclear, or broken content in OS Guide.
title: "Correction: "
labels:
  - correction
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve OS Guide. Please do not include personal or identifying participant information.
  - type: input
    id: page
    attributes:
      label: Page or section
      description: Paste the page URL or name the relevant section.
      placeholder: "Section 3.2 or https://..."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What needs correcting?
      description: Quote or describe the current content and explain the problem.
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Suggested correction
      description: Tell us what the guide should say instead, if you know.
  - type: textarea
    id: source
    attributes:
      label: Supporting source
      description: Add a reliable source or explain how you verified the correction.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included private or identifying participant information.
          required: true
